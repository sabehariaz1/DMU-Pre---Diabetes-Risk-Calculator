<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pre-Diabetes Risk Assessment</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-gray-50 py-10 px-4">

    <!-- Risk Calculator Interface -->
    <div class="max-w-lg mx-auto bg-white p-6 rounded-lg shadow-md space-y-4">
        <h2 class="text-2xl font-bold text-gray-800 mb-4">Pre-Diabetes Risk Assessment</h2>

        <!-- Age Field -->
        <div>
            <label for="age" class="block text-sm font-medium text-gray-700">Age</label>
            <input type="number" id="age" name="age" value="0"
                class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 border p-2">
        </div>

        <!-- Family History Field -->
        <div>
            <label class="block text-sm font-medium text-gray-700">Do you have a family history of diabetes?</label>
            <div class="mt-2 space-x-4">
                <label class="inline-flex items-center">
                    <input type="radio" name="family_history" value="Yes" class="form-radio">
                    <span class="ml-2">Yes</span>
                </label>
                <label class="inline-flex items-center">
                    <input type="radio" name="family_history" value="No" class="form-radio" checked>
                    <span class="ml-2">No</span>
                </label>
            </div>
        </div>

        <!-- Physical Activity Field -->
        <div>
            <label for="activity" class="block text-sm font-medium text-gray-700">Do you engage in regular physical activity?</label>
            <select id="activity" name="physical_activity" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
                <option value="Yes">Yes (At least 150 mins/week)</option>
                <option value="No">No</option>
            </select>
        </div>

        <!-- Live Score Display Widget Box -->
        <div class="mt-6 p-4 bg-indigo-50 rounded-md border border-indigo-100 text-center">
            <span class="block text-sm font-semibold text-indigo-700 uppercase tracking-wider">Your Calculated Risk Score</span>
            <span id="scoreDisplay" class="text-4xl font-extrabold text-indigo-900">0%</span>
        </div>
    </div>

    <!-- Interactive Auto-Save JavaScript Engine -->
    <script>
        let saveTimeout = null;

        // Function that automatically calculates points
        function calculateAndAutoSave() {
            const ageInput = document.getElementById('age').value;
            const age = ageInput ? parseInt(ageInput) : 0;
            const familyHistory = document.querySelector('input[name="family_history"]:checked').value;
            const physicalActivity = document.getElementById('activity').value;

            // Math Logic
            let points = 0;
            if (age >= 40) points += 2;
            if (familyHistory === "Yes") points += 2;
            if (physicalActivity === "No") points += 1;
            const finalRiskScore = (points / 5) * 100;

            // Dynamically update display text on the user screen instantly
            document.getElementById('scoreDisplay').innerText = finalRiskScore + "%";

            // Clear any old pending saves while the user is actively clicking fields
            clearTimeout(saveTimeout);

            // Wait 2.5 seconds after their last input change, then silently push data
            saveTimeout = setTimeout(() => {
                const dataPayload = {
                    timestamp: new Date().toISOString(),
                    age: age,
                    family_history: familyHistory,
                    physical_activity: physicalActivity,
                    score: finalRiskScore + "%"
                };

                // ⚠️ PASTE YOUR COPIED GOOGLE WEB APP URL HERE FROM PREVIOUS STEP
                const storageUrl = "PASTE_YOUR_GOOGLE_WEB_APP_URL_HERE";

                if (storageUrl !== "PASTE_YOUR_GOOGLE_WEB_APP_URL_HERE") {
                    fetch(storageUrl, {
                        method: "POST",
                        mode: "no-cors",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(dataPayload)
                    })
                    .then(() => console.log("Metrics securely archived to spreadsheet matrix."))
                    .catch(err => console.error("Sync error:", err));
                }
            }, 2500); 
        }

        // Listen for live adjustments across every interactive element
        document.getElementById('age').addEventListener('input', calculateAndAutoSave);
        document.getElementById('activity').addEventListener('change', calculateAndAutoSave);
        document.querySelectorAll('input[name="family_history"]').forEach(radio => {
            radio.addEventListener('change', calculateAndAutoSave);
        });
    </script>
</body>
</html>
