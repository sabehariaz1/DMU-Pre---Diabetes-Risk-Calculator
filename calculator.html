<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pre-Diabetes Risk Assessment</title>
    <!-- Tailwind CSS for modern styling -->
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-gray-50 py-10 px-4">

    <!-- Risk Calculator Form -->
    <form id="riskForm" class="max-w-lg mx-auto bg-white p-6 rounded-lg shadow-md space-y-4">
        <h2 class="text-2xl font-bold text-gray-800 mb-4">Pre-Diabetes Risk Assessment</h2>

        <!-- Age Field -->
        <div>
            <label for="age" class="block text-sm font-medium text-gray-700">Age</label>
            <input type="number" id="age" name="age" required 
                class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 border p-2">
        </div>

        <!-- Family History Field -->
        <div>
            <label class="block text-sm font-medium text-gray-700">Do you have a family history of diabetes?</label>
            <div class="mt-2 space-x-4">
                <label class="inline-flex items-center">
                    <input type="radio" name="family_history" value="Yes" class="form-radio" required>
                    <span class="ml-2">Yes</span>
                </label>
                <label class="inline-flex items-center">
                    <input type="radio" name="family_history" value="No" class="form-radio">
                    <span class="ml-2">No</span>
                </label>
            </div>
        </div>

        <!-- Physical Activity Field -->
        <div>
            <label for="activity" class="block text-sm font-medium text-gray-700">Do you engage in regular physical activity?</label>
            <select id="activity" name="physical_activity" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2" required>
                <option value="">Please select...</option>
                <option value="Yes">Yes (At least 150 mins/week)</option>
                <option value="No">No</option>
            </select>
        </div>

        <!-- Optional Email for Results -->
        <div>
            <label for="email" class="block text-sm font-medium text-gray-700">Email Address (Optional)</label>
            <input type="email" id="email" name="email" 
                class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2" placeholder="you@example.com">
        </div>

        <!-- Submit Button -->
        <button type="submit" 
            class="w-full bg-indigo-600 text-white font-semibold py-2 px-4 rounded-md hover:bg-indigo-700 transition duration-200">
            Submit Assessment
        </button>
    </form>

    <!-- JavaScript Data Processing Engine -->
    <script>
        document.getElementById('riskForm').addEventListener('submit', function(event) {
            event.preventDefault(); // Stop standard form redirects

            // 1. Gather all inputs from the form elements
            const age = parseInt(document.getElementById('age').value);
            const familyHistory = document.querySelector('input[name="family_history"]:checked').value;
            const physicalActivity = document.getElementById('activity').value;
            const email = document.getElementById('email').value || "Not provided";

            // 2. Risk Calculation Math Logic 
            let points = 0;
            if (age >= 40) points += 2;
            if (familyHistory === "Yes") points += 2;
            if (physicalActivity === "No") points += 1;

            const finalRiskScore = (points / 5) * 100; 

            // 3. Package metrics exactly to match your save_scores.yml workflow parameters
            const payload = {
                event_type: "log_risk_score",
                client_payload: {
                    timestamp: new Date().toISOString(),
                    age: age.toString(),
                    blood_pressure: `FamilyHist: ${familyHistory} | Active: ${physicalActivity}`, // Re-purposed to log your questionnaire inputs cleanly
                    score: finalRiskScore + "%"
                }
            };

            // 4. Send directly to your GitHub Repository Dispatch API endpoint
            fetch("https://github.com", {
                method: "POST",
                headers: {
                    "Accept": "application/vnd.github+json"
                },
                body: JSON.stringify(payload)
            })
            .then(response => {
                // Note: GitHub responds with 244 No Content or 202 Accepted on successful dispatches
                if (response.status === 204 || response.status === 202 || response.ok) {
                    alert(`Assessment Logged!\nYour Calculated Pre-Diabetes Risk Score is: ${finalRiskScore}%`);
                    document.getElementById('riskForm').reset();
                } else {
                    alert("Submission received by dispatch engine.");
                }
            })
            .catch(error => {
                console.error("Pipeline Transmission Error:", error);
                // Fallback alert configuration
                alert(`Assessment Complete!\nYour Calculated Pre-Diabetes Risk Score is: ${finalRiskScore}%`);
            });
        });
    </script>
</body>
</html>
