<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DMU Pre-Diabetes Risk Calculator</title>
    <!-- Tailwind CSS for clean styling -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-xl shadow-lg p-6 md:p-8 border border-slate-100">
        <h1 class="text-2xl font-bold text-blue-900 mb-2">Pre-Diabetes Risk Assessment</h1>
        <p class="text-sm text-slate-600 mb-6">Complete this quick form to calculate your risk score for our research study.</p>

        <form id="riskForm" class="space-y-4">
          <div>
              <label class="block text-sm font-medium text-slate-700 mb-1">Email Address</label>
              <input type="email" id="email" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>

          <div>
              <label class="block text-sm font-medium text-slate-700 mb-1">Age Group Score (0-2)</label>
              <input type="number" id="ageScore" min="0" max="2" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>

          <div>
              <label class="block text-sm font-medium text-slate-700 mb-1">BMI Score (0-3)</label>
              <input type="number" id="bmiScore" min="0" max="3" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>

          <button type="submit" class="w-full bg-blue-600 text-white font-semibold py-2.5 rounded-lg hover:bg-blue-700 transition">
              Calculate & Submit Score
          </button>
        </form>

        <div id="resultBox" class="hidden mt-6 p-4 rounded-lg bg-blue-50 border border-blue-200 text-center">
            <h3 class="font-bold text-blue-900">Assessment Complete</h3>
            <p id="scoreText" class="text-sm text-slate-700 mt-1"></p>
        </div>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzrWAlYPlgyPYSdjlpbsNnXJeuwQikirikGfMDZCF8yDi9A4gvh2CemUqmqyge9BN_D0w/exec";

        document.getElementById('riskForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const ageScore = parseInt(document.getElementById('ageScore').value) || 0;
            const bmiScore = parseInt(document.getElementById('bmiScore').value) || 0;
            const totalScore = ageScore + bmiScore;
            
            let category = totalScore >= 5 ? "High Risk" : "Low Risk";

            const payload = { email, score: totalScore, category };

            try {
                await fetch(WEB_APP_URL, {
                    method: "POST",
                    mode: "no-cors",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                document.getElementById('riskForm').classList.add('hidden');
                const resultBox = document.getElementById('resultBox');
                resultBox.classList.remove('hidden');
                document.getElementById('scoreText').innerText = `Your Total Score is ${totalScore} (${category}). Data logged successfully for research!`;
            } catch (error) {
                alert("Submission failed. Please check your network connection.");
            }
        });
    </script>
</body>
</html>
