<form action="https://formspree.io/f/xeaoobkd" method="POST" class="max-w-lg mx-auto bg-white p-6 rounded-lg shadow-md space-y-4">
    <h2 class="text-2xl font-bold text-gray-800 mb-4">Pre-Diabetes Risk Assessment</h2>

    <!-- Age Field -->
    <div>
        <label for="age" class="block text-sm font-medium text-gray-700">Age</label>
        <input type="number" id="age" name="age" required 
            class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 border p-2">
    </div>

    <!-- Family History Field -->
    <div>
        <label class="block text-sm font-medium text-gray-700">Do you have a family history of diabetes?</label>
        <div class="mt-2 space-x-4">
            <label class="inline-flex items-center">
                <input type="radio" name="family_history" value="Yes" class="form-radio" required>
                <span class="ml-2">Yes</span>
            </label>
            <label class="inline-flex items-center">
                <input type="radio" name="family_history" value="No" class="form-radio">
                <span class="ml-2">No</span>
            </label>
        </div>
    </div>

    <!-- Physical Activity Field -->
    <div>
        <label for="activity" class="block text-sm font-medium text-gray-700">Do you engage in regular physical activity?</label>
        <select id="activity" name="physical_activity" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2" required>
            <option value="">Please select...</option>
            <option value="Yes">Yes (At least 150 mins/week)</option>
            <option value="No">No</option>
        </select>
    </div>

    <!-- Optional Email for Results -->
    <div>
        <label for="email" class="block text-sm font-medium text-gray-700">Email Address (Optional)</label>
        <input type="email" id="email" name="email" 
            class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2" placeholder="you@example.com">
    </div>

    <!-- Submit Button -->
    <button type="submit" 
        class="w-full bg-indigo-600 text-white font-semibold py-2 px-4 rounded-md hover:bg-indigo-700 transition duration-200">
        Submit Assessment
    </button>
</form>
